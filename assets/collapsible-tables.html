<style>
/* A table in a cell marked long-table shows the rows that fit in one screen. A button
   beneath it opens the rest. Every other table shows in full. */
.table-row-hidden { display: none; }
button.table-more-toggle { display: block; margin: 0.5em 0 1em; padding: 0.4em 0.8em; border: 1px solid #dee2e6; border-radius: 4px; background: #f8f9fa; color: #495057; font-size: 0.9em; cursor: pointer; }
button.table-more-toggle:hover { background: #e9ecef; }
</style>
<script>
(function () {
  var scope = document.querySelector("#quarto-document-content") || document.body;
  // A table row with its padding is about two and a half lines of body text tall.
  var fontSize = parseFloat(window.getComputedStyle(document.body).fontSize) || 16;
  var rowsInScreen = Math.max(1, Math.floor(window.innerHeight / (2.5 * fontSize)));
  Array.prototype.forEach.call(scope.querySelectorAll(".long-table table"), function (table) {
    var rows = Array.prototype.slice.call(table.querySelectorAll("tbody tr"));
    if (rows.length <= rowsInScreen) return;
    var rest = rows.slice(rowsInScreen);
    rest.forEach(function (row) { row.classList.add("table-row-hidden"); });
    var button = document.createElement("button");
    button.type = "button";
    button.className = "table-more-toggle";
    button.setAttribute("aria-expanded", "false");
    button.textContent = "Show the other " + rest.length + " rows";
    button.addEventListener("click", function () {
      var opening = button.getAttribute("aria-expanded") === "false";
      rest.forEach(function (row) { row.classList.toggle("table-row-hidden", !opening); });
      button.setAttribute("aria-expanded", opening ? "true" : "false");
      button.textContent = opening ? "Show fewer rows" : "Show the other " + rest.length + " rows";
    });
    table.parentNode.insertBefore(button, table.nextSibling);
    table.dataset.moreRows = "yes";
  });
  // A printed page shows every row.
  window.addEventListener("beforeprint", function () {
    Array.prototype.forEach.call(document.querySelectorAll("table[data-more-rows]"), function (table) {
      Array.prototype.forEach.call(table.querySelectorAll("tr.table-row-hidden"), function (row) {
        row.classList.remove("table-row-hidden");
        row.dataset.hiddenBeforePrint = "yes";
      });
    });
  });
  window.addEventListener("afterprint", function () {
    Array.prototype.forEach.call(document.querySelectorAll("tr[data-hidden-before-print]"), function (row) {
      row.classList.add("table-row-hidden");
      delete row.dataset.hiddenBeforePrint;
    });
  });
})();
</script>
