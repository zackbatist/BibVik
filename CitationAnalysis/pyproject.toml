[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bibvik"
version = "0.1.0"
description = "Multi-generational citation graph analysis toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "lxml>=5.1.0",
    "pyyaml>=6.0.1",
    "unidecode>=1.3.8",
    "tqdm>=4.66.0",
]

[tool.setuptools.packages.find]
include = ["bibvik*"]
