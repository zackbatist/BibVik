[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bibvik"
version = "0.1.0"
description = "Multi-generational citation graph analysis toolkit"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31.0",
    "lxml>=5.1.0",
    "pyyaml>=6.0.1",
    "unidecode>=1.3.8",
    "tqdm>=4.66.0",
    "lingua-language-detector>=2.0.0",
]

[project.optional-dependencies]
# OCR support for scanned PDFs that GROBID cannot read.
# Also requires Tesseract to be installed at the system level:
#   macOS:  brew install tesseract
#   Ubuntu: apt install tesseract-ocr
# Install this extra with: pip install -e ".[ocr]"
ocr = ["ocrmypdf>=16.0.0"]

[tool.setuptools.packages.find]
include = ["bibvik*"]