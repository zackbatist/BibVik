# BibVik corrections
#
# Confirmed corrections are applied by --postprocess as pass 0.
# Pipeline-generated candidates are appended here with _draft: true after
# each --postprocess run. Review them, remove _draft: true and fill in
# the note to confirm, or delete the entry to reject.
#
# Actions: merge | delete | set
# note field is required on all confirmed entries.
#
