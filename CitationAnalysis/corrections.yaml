# BibVik corrections
#
# Confirmed corrections applied as pass 0 of --postprocess.
# Pipeline-generated draft candidates are appended with _draft: true
# after each run. Remove _draft: true and fill in the note to confirm;
# delete the entry to reject. Notes required on all confirmed entries.
#
# Actions: merge | delete | set

# widerstrom2004 and norderang2004 have the same title with different author
# name parsing. Verify correct author against source before confirming.
#
# - action: merge
#   keep: widerstrom2004
#   discard: norderang2004
#   note: ""

# OCR merge pairs from _OCR_MERGE_PAIRS — citekeys to be verified against
# the actual bibliography before uncommenting.
#
# - action: merge
#   keep: ???
#   discard: ???
#   note: "OCR corruption: 'wamers' read as 'wamets' in Baastrup 2014"
#
# - action: merge
#   keep: ???
#   discard: ???
#   note: "OCR corruption: leading 'o' dropped from 'orsnes'"

- action: merge
  keep: widerstrom2004
  discard: norderang2004
  note: "Same work (Norderäng & Widerström 2004, Gotländskt Arkiv 76:82-89).
    Author order differs between source papers causing different citekeys.
    widerstrom2004 has volume field and cleaner author parsing."